name: 试玩问题
description: 报告可重复的问题，而非只写“不能用”。
title: "[问题] "
body:
  - type: input
    id: version
    attributes:
      label: Release版本或提交号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、实际结果、预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录像或Console第一条错误
      description: 不上传含令牌、账号凭据或其他个人信息的完整日志。
