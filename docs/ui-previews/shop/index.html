<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>昨日圆车 · 商店交互预览</title><link rel="stylesheet" href="shop.css"></head>
<body><main class="screen" aria-label="底部商店预览">
<section class="reserve"><div class="reserve-head"><span>备战区 <b id="bench-count">0</b><small>/ 10</small></span><span id="hint">同种同星三张自动升星</span><button id="sell" hidden></button></div><div id="bench" class="bench" aria-label="备战棋子"></div></section>
<section class="shop" aria-label="棋子商店"><header class="topbar"><div class="balance"><img class="currency-icon" src="assets/originium-ui.png" alt="源石"><span>源石</span><strong id="gold">32</strong><span id="money-fx" aria-hidden="true"></span></div><div class="growth"><div class="level-box" tabindex="0" aria-describedby="odds"><span>等级</span><strong id="level">5</strong><div id="odds" role="tooltip"></div></div><div class="xp-track"><span id="xpbar"></span></div><span id="xpnum"></span><button id="buyxp">升级 <img class="currency-icon" src="assets/originium-ui.png" alt="源石"><span>4</span></button></div></header>
<div class="shop-body"><div id="offers" class="offers"></div><div class="actions"><button id="refresh"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 12A11 11 0 0 0 7 8L3 12m0-8v8h8M6 20a11 11 0 0 0 19 4l4-4m0 8v-8h-8"/></svg><span>刷新</span><small><img class="currency-icon" src="assets/originium-ui.png" alt="源石">2</small></button><button id="lock" aria-label="锁定本轮棋子" aria-pressed="false"></button></div></div>
</section><div id="sell-zone" hidden aria-live="polite"><svg class="sell-tray" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 27v12h34V27M24 6v23M15 20l9 9 9-9"/></svg><div><strong id="sell-instruction">拖到此处出售</strong><span id="sell-role"></span></div><span class="sell-return"><img class="currency-icon" src="assets/originium-ui.png" alt="源石"><b id="sell-price"></b></span><small id="sell-cancel">拖回备战区取消</small></div><div id="toast" role="status" aria-live="polite"></div><div id="fx" aria-hidden="true"></div><div id="confirm" class="modal" hidden><div role="dialog" aria-modal="true" aria-labelledby="confirm-text"><p id="confirm-text"></p><button id="confirm-no">取消</button><button id="confirm-yes">购买并合成</button></div></div>
</main><nav class="demo-nav" aria-label="预览场景"><span>效果预览</span><a href="?demo=normal">自由招募</a><a href="?demo=star2">两星合成</a><a href="?demo=star3">三星合成</a><a href="?demo=upgrade">等级提升</a><button id="reset">重置本次演示</button></nav>
<script src="roster-data.js"></script><script src="shop-model.js"></script><script src="sell-drag.js"></script><script src="shop.js"></script></body></html>
